# ============================================================
# Template 管理平台 · **后台管理端** Nginx 站点配置（web_admin）
#
# 由 deploy/template.sh 自动安装：
#   render_conf 把 __PORT__ 替换成实际端口，再装到
#   /etc/nginx/sites-available/template-admin  →  sites-enabled 软链
# 手动安装（等价）：
#   sudo sed 's/__PORT__/8080/g' deploy/nginx/template-admin.conf \
#     | sudo tee /etc/nginx/sites-available/template-admin >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/template-admin /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 站点分工：
#   template-admin（本文件，默认 8080）→ 后台 web_admin 产物
#   template-web  （同目录另一份，默认 8084）→ 前端 web 产物
#   两者都只把 /api/ 转发到同一个后端（127.0.0.1:3000），token 天然互通。
#
# 设计约束（与参考项目一致）：
# - **不占用 80**，也不设 default_server —— 同机其它站点不受影响
# - 只 reload，绝不 systemctl stop nginx
# ============================================================

server {
    # __PORT__ 由 deploy/template.sh 渲染；直接手拷本文件会原样留下占位符，
    # nginx -t 会报 "invalid port"，这正好是提醒你走脚本。
    listen       __PORT__;
    listen  [::]:__PORT__;
    # TODO(部署端) 有域名就填域名；纯内网保持 _
    server_name  _;

    # TODO(部署端) 后台产物目录，需与 template.sh 的 ADMIN_WEB_DEST 一致
    root   /var/www/template/admin;
    index  index.html;

    access_log /var/log/nginx/template-admin.access.log;
    error_log  /var/log/nginx/template-admin.error.log;

    # ------------------------------------------------------------------
    # 上传大小 —— 第一道闸门
    #
    # 三层限制必须对齐（改任何一处都要同步另两处）：
    #   1) 这里                20m   —— 超了 Nginx 直接 413，请求体不进 Node 内存
    #   2) Multer limits       10MB  —— server/src/modules/file/file.constants.ts
    #                                  的 MAX_FILE_SIZE
    #   3) 业务策略 maxSize    10MB  —— file.policy.ts，业务只能收紧不能放宽
    #
    # 为什么给到 20m 而不是 10m：multipart 表单有边界/头部开销，多个文件时按
    # 请求体总量算。留一倍余量可以在不改 Nginx 的前提下把单文件上限提到 20MB。
    # ------------------------------------------------------------------
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # 前端 SPA（后台是 vue-router history 模式，深链接必须回退 index.html）
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 入口 HTML 不缓存：发版后避免浏览器仍引用旧 hash 产物
    location = /index.html {
        add_header Cache-Control "no-store";
        expires -1;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后端接口（Nest，PM2 fork 单实例，127.0.0.1:3000）
    # 前端 axios baseURL = /api/v1，路径原样透传
    # ------------------------------------------------------------------
    location /api/ {
        # TODO(部署端) 后端端口与 server/.env.prod 的 PORT 一致
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 大文件上传/下载、将来的 Excel 导入都需要更长的读超时
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;

        # 上传时边收边转给后端，避免 Nginx 先落盘再转发（大文件占磁盘）
        proxy_request_buffering off;
    }

    # 健康检查直连就绪探针（探数据库连通），不写访问日志
    location = /health {
        proxy_pass http://127.0.0.1:3000/api/v1/health/ready;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 安全响应头（应用层 helmet 也会带，这里给静态资源补一层）
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        no-referrer;

    # ------------------------------------------------------------------
    # gzip
    # ------------------------------------------------------------------
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;
}

# ============================================================
# HTTPS（如需）
# 最省事：sudo certbot --nginx -d your.domain.com，它会自动改写上面的 server 块。
# 纯内网自签证书则手动加 443 server 块，把上面 location 段复制过去即可。
# ============================================================
