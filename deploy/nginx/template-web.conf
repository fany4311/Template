# ============================================================
# Template 管理平台 · **前端 web** Nginx 站点配置（面向普通业务用户）
#
# 由 deploy/template.sh 自动安装（render_conf 把 __PORT__ 替换成实际端口）：
#   /etc/nginx/sites-available/template-web  →  sites-enabled 软链
# 手动安装（等价）：
#   sudo sed 's/__PORT__/8084/g' deploy/nginx/template-web.conf \
#     | sudo tee /etc/nginx/sites-available/template-web >/dev/null
#   sudo ln -sf /etc/nginx/sites-available/template-web /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 站点分工：
#   template-admin（8080）→ 后台 web_admin 产物（仅超管/管理员可进）
#   template-web  （本文件，默认 8084）→ 前端 web 产物（任何账号可登录）
#   两者 /api/ 都转发到同一个后端 127.0.0.1:3000，所以 token 是互通的：
#   在 8084 登录拿到的 token，粘到 8080 的控制台里同样有效（也正因如此，
#   后台的 console:access 准入必须在**后端**按权限码校验，前端守卫只是顺手挡一下）。
#
# ⚠️ 为什么默认不是 8081：隔壁 BigScreen 的 screen 站点占着 8081。
#
# 设计约束（与参考项目一致）：
# - **不占用 80**，也不设 default_server —— 同机其它站点不受影响
# - 只 reload，绝不 systemctl stop nginx
# ============================================================

server {
    listen       __PORT__;
    listen  [::]:__PORT__;
    # TODO(部署端) 有域名就填域名；纯内网保持 _
    server_name  _;

    # TODO(部署端) 前端 web 产物目录，需与 template.sh 的 WEB_DEST 一致
    root   /var/www/template/web;
    index  index.html;

    access_log /var/log/nginx/template-web.access.log;
    error_log  /var/log/nginx/template-web.error.log;

    # 上传大小：与 admin 站点、与后端 MAX_FILE_SIZE 三级对齐（见 admin 站点注释）
    client_max_body_size 20m;

    # ------------------------------------------------------------------
    # 前端 SPA（vue-router history 模式，深链接回退 index.html）
    # ------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        expires -1;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ------------------------------------------------------------------
    # 后端接口（同一个 Nest 后端）
    # ------------------------------------------------------------------
    location /api/ {
        # TODO(部署端) 后端端口与 server/.env.prod 的 PORT 一致
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/api/v1/health/ready;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 安全响应头 + gzip
    # ------------------------------------------------------------------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;
    add_header Referrer-Policy        no-referrer;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;
}
